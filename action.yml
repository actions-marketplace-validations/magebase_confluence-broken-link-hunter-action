name: "Markdown & README Broken Link Checker Action"
description: "Fast recursive broken link, anchor, and external documentation verifier for markdown repositories."
author: "Magebase Inc"
inputs:
  target_param:
    description: "Target input for analysis"
    required: true
    default: "current_repo"
  fail_on_severity:
    description: "Fail check run if severity is HIGH or CRITICAL"
    required: false
    default: "true"
outputs:
  status:
    description: "Audit evaluation status"
  score:
    description: "Numeric health score or CVSS rating"
runs:
  using: "node20"
  main: "dist/index.js"
branding:
  icon: "shield"
  color: "purple"
